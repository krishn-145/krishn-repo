<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRISHN • Termux Repository</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#05070d;color:#eaf7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
body:before{content:"";position:fixed;inset:-40%;background:radial-gradient(circle at 50% 40%,#063b75 0,#071525 18%,transparent 45%);animation:pulse 5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12);opacity:.7}}
.card{position:relative;width:min(720px,92%);padding:42px 28px;text-align:center;border:1px solid #1769aa;border-radius:28px;background:rgba(4,12,24,.82);box-shadow:0 0 50px #006eff22;backdrop-filter:blur(14px)}
.logo{font-size:clamp(42px,11vw,92px);font-weight:900;letter-spacing:.18em;margin-left:.18em;background:linear-gradient(90deg,#22aaff,#8ee8ff,#1688ff,#22aaff);background-size:300%;-webkit-background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:300%}}
.sub{color:#8bbbd8;letter-spacing:.28em;font-size:12px;margin-top:4px}
.btn{display:inline-block;margin-top:30px;padding:14px 25px;border-radius:14px;text-decoration:none;color:white;font-weight:800;background:linear-gradient(135deg,#087cff,#00b7ff);box-shadow:0 0 28px #008cff55;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 40px #008cff88}
.info{margin-top:26px;color:#9db6c8;font-size:14px;line-height:1.8}
a{color:#4cc9ff}
</style>
</head>
<body>
<main class="card">
  <div class="logo">KRISHN</div>
  <div class="sub">TERMUX APT REPOSITORY</div>
  <a class="btn" href="install.sh">INSTALL REPOSITORY</a>
  <div class="info">
    Install the repository, then use<br>
    <code>pkg install &lt;tool-name&gt;</code><br><br>
    GitHub: <a href="https://github.com/krishn-145">krishn-145</a><br>
    Telegram: <a href="https://t.me/krishn18">@krishn18</a>
  </div>
</main>
</body>
</html>
